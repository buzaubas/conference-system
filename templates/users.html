<!DOCTYPE html>
<html>
<head>
    <title>Users (CRUD)</title>
</head>
<body>
<h2>Navigation</h2>
<a href="/">Dashboard</a> | <a href="/users">Manage Users</a> | <a href="/papers">Manage Papers</a>
<hr>
<h2>Add User</h2>
<form method="POST" action="/users">
    <input type="text" name="given_name" placeholder="Имя" required>
    <input type="text" name="surname" placeholder="Фамилия" required>
    <input type="email" name="email" placeholder="Email" required><br><br>
    <input type="text" name="affiliation" placeholder="Организация">
    <input type="text" name="country" placeholder="Страна">
    <input type="text" name="phone_number" placeholder="Телефон"><br><br>
    <button type="submit">Add User</button>
</form>
<br>
<h1>User Control</h1>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Email</th>
        <th>Name</th>
        <th>Surname</th>
        <th>Actions</th>
    </tr>
    {% for user in users %}
    <tr>
        <td>{{ user.user_id }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.given_name }}</td>
        <td>{{ user.surname }}</td>
        <td>
            <a href="/edit/{{ user.user_id }}">Edit</a> |
            <form method="POST" action="/delete/{{ user.user_id }}" style="display:inline;">
                <button type="submit" onclick="return confirm('Are you sure?');">Delete</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>
</body>
</html>
